<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ícone: cubo 3D tech -->
  <g transform="translate(8, 8)">
    <!-- Face superior -->
    <polygon points="32,4 56,16 32,28 8,16" fill="url(#grad2)" opacity="0.95"/>
    <!-- Face esquerda -->
    <polygon points="8,16 32,28 32,56 8,44" fill="#1D4ED8" opacity="0.9"/>
    <!-- Face direita -->
    <polygon points="56,16 32,28 32,56 56,44" fill="url(#grad1)" opacity="0.95"/>
    <!-- Linhas de circuito -->
    <line x1="32" y1="28" x2="32" y2="4" stroke="#7DD3FC" stroke-width="0.8" opacity="0.6"/>
    <line x1="32" y1="28" x2="8" y2="16" stroke="#7DD3FC" stroke-width="0.8" opacity="0.6"/>
    <line x1="32" y1="28" x2="56" y2="16" stroke="#7DD3FC" stroke-width="0.8" opacity="0.6"/>
    <!-- Nó central -->
    <circle cx="32" cy="28" r="2.5" fill="#38BDF8" filter="url(#glow)"/>
    <!-- Nós dos vértices -->
    <circle cx="32" cy="4"  r="1.8" fill="#7DD3FC" opacity="0.9"/>
    <circle cx="8"  cy="16" r="1.8" fill="#7DD3FC" opacity="0.9"/>
    <circle cx="56" cy="16" r="1.8" fill="#7DD3FC" opacity="0.9"/>
    <circle cx="32" cy="56" r="1.8" fill="#7DD3FC" opacity="0.9"/>
    <circle cx="8"  cy="44" r="1.8" fill="#7DD3FC" opacity="0.9"/>
    <circle cx="56" cy="44" r="1.8" fill="#7DD3FC" opacity="0.9"/>
    <!-- Linhas laterais -->
    <line x1="8"  y1="16" x2="8"  y2="44" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <line x1="56" y1="16" x2="56" y2="44" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <line x1="32" y1="56" x2="8"  y2="44" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <line x1="32" y1="56" x2="56" y2="44" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Texto ITM -->
  <text x="86" y="42"
        font-family="'Segoe UI', 'Arial Black', sans-serif"
        font-size="32" font-weight="800"
        letter-spacing="-1"
        fill="url(#grad1)">ITM</text>

  <!-- Linha decorativa -->
  <rect x="86" y="48" width="80" height="2.5" rx="1.5" fill="url(#grad1)" opacity="0.4"/>

  <!-- Texto Technology -->
  <text x="87" y="64"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="500"
        letter-spacing="3.5"
        fill="#64748B">TECHNOLOGY</text>
</svg>
